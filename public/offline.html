<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Trainy — sin conexión</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d100e;
        --card: #151a16;
        --line: #29312b;
        --ink: #edf2ec;
        --ink-2: #a6b0a8;
        --ink-3: #737d75;
        --volt: #c8f169;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 22rem; text-align: center; }
      .logo { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
      .logo span { color: var(--volt); }
      h1 { margin: 1.5rem 0 0; font-size: 1.25rem; line-height: 1.3; }
      p { margin: 0.6rem 0 0; color: var(--ink-2); font-size: 0.94rem; line-height: 1.55; }
      .note {
        margin-top: 1.25rem;
        padding: 0.85rem 1rem;
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: 0.6rem;
        color: var(--ink-2);
        font-size: 0.85rem;
        text-align: left;
        line-height: 1.5;
      }
      button {
        margin-top: 1.5rem;
        width: 100%;
        height: 3rem;
        border: 0;
        border-radius: 0.6rem;
        background: var(--volt);
        color: #131a05;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }
      button:active { background: #afda4e; }
      small { display: block; margin-top: 1rem; color: var(--ink-3); font-size: 0.75rem; }
    </style>
  </head>
  <body>
    <main>
      <p class="logo">Train<span>y</span></p>
      <h1>Estás sin conexión</h1>
      <p>Pasa en gimnasios de sótano. No es la app: es la señal.</p>
      <p class="note">
        Lo que ya marcaste antes de perder señal está guardado en el teléfono y se
        sube solo apenas vuelva la conexión. No repitas el registro.
      </p>
      <button onclick="location.reload()">Reintentar</button>
      <small>Trainy · tu plan de entrenamiento, vivo</small>
    </main>
  </body>
</html>
